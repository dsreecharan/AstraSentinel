services:
  mediamtx:
    profiles: [media]
    image: bluenviron/mediamtx:1.21.4-ffmpeg@sha256:1fa0abbefb6f181bf0da075c65a75505ee43bb9996e4a4b5fd30a4ab7dea01e6
    entrypoint:
      - /bin/sh
      - -ec
      - |
        test -n "$${MTX_AUTHINTERNALUSERS_0_PASS}" || { echo "Set ASTRA_MEDIA_PUBLISH_PASSWORD"; exit 1; }
        exec /mediamtx /mediamtx.yml
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: "${ASTRA_MEDIA_PUBLISH_PASSWORD:-}"
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:8554:8554/tcp"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:8189:8189/udp"
      - "127.0.0.1:8189:8189/tcp"
    networks: [media]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9998/metrics"]
      interval: 3s
      timeout: 2s
      retries: 15
    stop_grace_period: 5s

  postgis:
    profiles: [postgis]
    image: postgis/postgis:17-3.7-alpine@sha256:edb61bdfede3dd78074fb1a9e43523510d7fe461817c95f44301be8dfebd04b9
    environment:
      POSTGRES_DB: astra_phase2
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: "${ASTRA_POSTGIS_PASSWORD:-}"
    ports:
      - "127.0.0.1:55432:5432"
    networks: [database]
    volumes:
      - postgis:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "astra", "-d", "astra_phase2"]
      interval: 3s
      timeout: 2s
      retries: 25
    stop_grace_period: 10s

networks:
  media: {}
  database: {}

volumes:
  postgis: {}
