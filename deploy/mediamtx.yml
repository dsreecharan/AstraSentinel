logLevel: warn
authMethod: internal
authInternalUsers:
  - user: publisher
    pass: ""
    permissions:
      - action: publish
        path: monitor
  - user: any
    permissions:
      - action: read
        path: monitor
  - user: any
    ips: [127.0.0.1]
    permissions:
      - action: metrics
metrics: true
metricsAddress: "127.0.0.1:9998"
rtsp: true
rtspTransports: [tcp]
rtmp: false
srt: false
moq: false
hls: true
hlsVariant: fmp4
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsAlwaysRemux: true
hlsAllowOrigins: ["http://127.0.0.1:8888"]
webrtc: true
webrtcAllowOrigins: ["http://127.0.0.1:8889"]
webrtcLocalUDPAddress: ":8189"
webrtcLocalTCPAddress: ":8189"
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [127.0.0.1]
paths:
  monitor:
    source: publisher
    overridePublisher: false
    record: false
